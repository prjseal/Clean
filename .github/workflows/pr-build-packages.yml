name: PR - Build NuGet Packages

on:
  # pull_request_target always runs the copy of this workflow on the default branch (main),
  # which can't build other major versions. PRs into dev/ branches use pull_request, which runs
  # the PR's own copy of the workflow. Fork PRs into dev/ get a read-only token, so they can't
  # publish packages or comment.
  pull_request_target:
    branches:
      - main
  pull_request:
    branches:
      - 'dev/**'
  workflow_dispatch:
    inputs:
      run-template-tests:
        description: 'Run Template Installation and Site tests'
        required: false
        type: boolean
        default: false

jobs:
  build-packages:
    if: github.repository == 'prjseal/Clean'
    runs-on: windows-latest
    permissions:
      contents: write
      packages: write
      pull-requests: write

    steps:
      - name: Checkout repository
        # Pinned to v6: this runs on pull_request_target, and v7 refuses to check out fork PR heads
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Setup .NET 11
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '11.0.x'

      - name: Configure custom NuGet sources from PR description
        if: github.event_name != 'workflow_dispatch'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./.github/workflows/powershell/Configure-CustomNuGetSources.ps1 -PrNumber "${{ github.event.pull_request.number }}"

      - name: Get latest NuGet version and create build version
        id: version
        shell: pwsh
        run: |
          ./.github/workflows/powershell/Get-BuildVersion.ps1 -BuildNumber "${{ github.run_number }}" -WorkspacePath "${{ github.workspace }}"

      - name: Display version info
        shell: pwsh
        run: |
          ./.github/workflows/powershell/Show-BuildVersionInfo.ps1 -BaseVersion "${{ steps.version.outputs.base_version }}" -BuildNumber "${{ github.run_number }}" -FullVersion "${{ steps.version.outputs.version }}"

      # Documentation: .github/CreateNuGetPackages-Documentation.md
      # This script creates NuGet packages by starting Umbraco, downloading package via API,
      # applying BlockList label fixes, updating .csproj versions, and building all packages.
      - name: Run CreateNuGetPackages script
        shell: pwsh
        run: |
          Write-Host "Running CreateNuGetPackages.ps1 with version ${{ steps.version.outputs.version }}"
          ./.github/workflows/powershell/CreateNuGetPackages.ps1 -Version "${{ steps.version.outputs.version }}"

      - name: Upload NuGet packages as artifacts
        uses: actions/upload-artifact@v7
        with:
          name: nuget-packages-${{ steps.version.outputs.version }}
          path: .artifacts/nuget/*.nupkg
          if-no-files-found: warn

      - name: Publish to GitHub Packages
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./.github/workflows/powershell/Publish-ToGitHubPackages.ps1 -GitHubToken $env:GITHUB_TOKEN -RepositoryOwner "${{ github.repository_owner }}"

      - name: Test Package Installation and Site
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./.github/workflows/powershell/Test-PackageInstallation.ps1 -Version "${{ steps.version.outputs.version }}" -WorkspacePath "${{ github.workspace }}"

      - name: Upload Screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: package-test-screenshots-${{ steps.version.outputs.version }}
          path: test-installation/screenshots/*.png
          if-no-files-found: warn

      - name: Upload Package Test Logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: package-test-logs-${{ steps.version.outputs.version }}
          path: |
            test-installation/site.log
            test-installation/site.err
            test-installation/TestProject/umbraco/Logs/*.json
          if-no-files-found: warn

      - name: Post first screenshot as PR comment
        if: always() && github.event_name != 'workflow_dispatch'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./.github/workflows/powershell/Add-PrScreenshotComment.ps1 -ScreenshotsPath "${{ github.workspace }}/test-installation/screenshots" -PrNumber "${{ github.event.pull_request.number }}" -Repository "${{ github.repository }}" -RunId "${{ github.run_id }}" -Version "${{ steps.version.outputs.version }}"

      - name: Test Template Installation and Site
        if: inputs.run-template-tests == true
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./.github/workflows/powershell/Test-TemplateInstallation.ps1 -Version "${{ steps.version.outputs.version }}" -WorkspacePath "${{ github.workspace }}"

      - name: Upload Template Screenshots
        if: always() && inputs.run-template-tests == true
        uses: actions/upload-artifact@v7
        with:
          name: template-screenshots-${{ steps.version.outputs.version }}
          path: test-template-TestTemplateProject/TestTemplateProject/screenshots/*.png
          if-no-files-found: warn

      - name: Upload Template Test Logs
        if: always() && inputs.run-template-tests == true
        uses: actions/upload-artifact@v7
        with:
          name: template-test-logs-${{ steps.version.outputs.version }}
          path: |
            test-template-TestTemplateProject/TestTemplateProject/site.log
            test-template-TestTemplateProject/TestTemplateProject/site.err
            test-template-TestTemplateProject/TestTemplateProject/**/umbraco/Logs/*.json
          if-no-files-found: warn

      - name: Build Summary
        if: always()
        shell: pwsh
        run: |
          ./.github/workflows/powershell/Show-BuildSummary.ps1 -Version "${{ steps.version.outputs.version || 'not created' }}" -PrNumber "${{ github.event.pull_request.number || 'none (manual run)' }}" -Branch "${{ github.head_ref || github.ref_name }}" -Actor "${{ github.actor }}" -Repository "${{ github.repository }}"
